<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Groq-inspired icon with lightning bolt for speed -->
  <defs>
    <linearGradient id="groqGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="45" fill="url(#groqGradient)"/>
  
  <!-- Lightning bolt for speed -->
  <path d="M 55 20 L 35 50 L 50 50 L 45 80 L 65 50 L 50 50 Z" 
        fill="#FFFFFF" 
        stroke="none"/>
  
  <!-- Optional: Add small chip pattern -->
  <circle cx="30" cy="30" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="70" cy="30" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="30" cy="70" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="70" cy="70" r="3" fill="#FFFFFF" opacity="0.5"/>
</svg>
