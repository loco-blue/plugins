name: get_positions
label: {en_US: "Get Positions"}
category: exchange
description: {en_US: "Fetch open futures positions for a symbol on the connected exchange account. Futures only - spot has no position concept, use get_balance for spot holdings."}
icon: list
source: nodes/get_positions.py

inputs:
  - name: symbol
    type: string
    required: true
  - name: testnet
    type: boolean
    required: false
    default: true

outputs:
  - name: positions
    type: array
    description: {en_US: "[{symbol, side, entry_price, quantity}]"}
