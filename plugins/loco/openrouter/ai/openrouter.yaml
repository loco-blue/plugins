name: openrouter
label:
  en_US: OpenRouter
  vi_VN: OpenRouter
description:
  en_US: OpenRouter Provider — unified LLM, embedding, and rerank models from 300+ providers
  vi_VN: OpenRouter Provider — mô hình LLM, embedding và rerank hợp nhất từ hơn 300 nhà cung cấp
icon: icon.svg

source: ai/provider.py
provider: openrouter

