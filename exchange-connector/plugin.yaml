name: exchange-connector
version: 0.1.0
type: node
author: loco
label: {en_US: Exchange Connector}
description: {en_US: "Multi-exchange market data and order placement (Binance, OKX)"}
icon: icon.svg
license: MIT

dependencies:
  python:
    loco-sdk: ">=0.2.5"
    httpx: ">=0.27.0"

permissions:
  - workflow:execute

auth:
  - auth/binance.yaml
  - auth/okx.yaml

nodes:
  - nodes/get_klines.yaml
  - nodes/place_order.yaml
  - nodes/get_positions.yaml
  - nodes/cancel_order.yaml
  - nodes/get_balance.yaml
  - nodes/set_leverage.yaml

loco_version: ">=0.1.0"
python_version: ">=3.10"
