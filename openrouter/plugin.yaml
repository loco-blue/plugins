# Plugin Metadata
name: openrouter
version: 0.1.0
type: node
author: loco
label:
  en_US: OpenRouter
description:
  en_US: OpenRouter provider plugin — unified access to LLM, embedding, and rerank models from 300+ providers
icon: icon.svg
license: MIT

# Dependencies
dependencies:
  python:
    loco-sdk: ">=0.2.8"
    pydantic: ">=2.0.0"
    openai: ">=1.0.0"
    httpx: ">=0.27.0"

# Permissions
permissions:
  - workflow:execute

# Authentication Provider Definitions
auth:
  - auth/openrouter.yaml

ai:
  - ai/openrouter.yaml

# Version Requirements
loco_version: ">=0.1.0"
python_version: ">=3.10"
